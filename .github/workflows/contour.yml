name: Contour

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contour-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contour engine
        run: pnpm --filter @contour/schema --filter @contour/renderer --filter @contour/cli build

      - name: Analyze PR
        run: |
          node packages/cli/dist/bin.js analyze \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --provider gemini \
            --api-key-env GEMINI_API_KEY \
            --out "${RUNNER_TEMP}/contour/graph.json"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Render Diagrams
        run: |
          node packages/cli/dist/bin.js render "${RUNNER_TEMP}/contour/graph.json" \
            --out "${RUNNER_TEMP}/contour/assets"

      - name: Publish SVGs & Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DATA_BRANCH: contour
        run: |
          bash packages/action/scripts/publish.sh
          ASSETS_URL="https://raw.githubusercontent.com/${{ github.repository }}/${DATA_BRANCH}/pr/${PR_NUMBER}/${HEAD_SHA}"
          node packages/cli/dist/bin.js comment \
            --graph "${RUNNER_TEMP}/contour/assets/drawn.graph.json" \
            --manifest "${RUNNER_TEMP}/contour/assets/manifest.json" \
            --asset-base-url "${ASSETS_URL}" \
            --out "${RUNNER_TEMP}/contour/comment.md"
          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/contour/comment.md"
