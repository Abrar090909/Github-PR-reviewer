name: Contour GitHub App
url: https://contour-wheat.vercel.app
hook_url: https://contour-wheat.vercel.app/api/webhooks/github
hook_attributes:
  url: https://contour-wheat.vercel.app/api/webhooks/github
  content_type: json
  active: true
redirect_url: https://contour-wheat.vercel.app/setup
setup_url: https://contour-wheat.vercel.app/setup
setup_on_update: true
description: Architecture and data-flow diagrams, a walkthrough and a code review for every pull request, posted as one comment and kept current on every push.
public: true
default_events:
  - pull_request
  - installation
  - installation_repositories
default_permissions:
  contents: read
  metadata: read
  pull_requests: write
