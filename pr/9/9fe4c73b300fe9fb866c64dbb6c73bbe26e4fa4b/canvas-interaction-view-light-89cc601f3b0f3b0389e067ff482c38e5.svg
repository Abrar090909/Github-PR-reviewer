<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 408" width="1284" height="408" role="img" aria-label="Canvas &amp; Overlay Architecture">
<title>Canvas &amp; Overlay Architecture</title>
<desc>Shows the interaction boundary between floating overlays and canvas drag handling.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.lanebox{fill:rgba(255,255,255,.55)}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#59636e}.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}.card-added{stroke:#1f883d;stroke-opacity:.55}.card-modified{stroke:#bf8700;stroke-opacity:.5}.ghost{opacity:.55}.ghost .card{stroke:#cf222e;stroke-dasharray:4 3;stroke-opacity:.6}.context{opacity:.82}.ntitle{font-weight:600;fill:#1f2328}.strike{text-decoration:line-through}.nsub{font-size:9.5px;fill:#59636e;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace}.chip{fill:#f1f3f5}.glyph{fill:#59636e}.glyph-stroke{stroke:#59636e;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-added rect{fill:#b9f0c4;stroke:rgba(31,136,61,.55)}.bdg-added text{fill:#116329}.bdg-modified rect{fill:#fae17d;stroke:rgba(154,103,0,.55)}.bdg-modified text{fill:#7d4e00}.bdg-removed rect{fill:#ffcecb;stroke:rgba(207,34,46,.5)}.bdg-removed text{fill:#a40e26}.bdg-neutral rect{fill:#f1f3f5;stroke:#d1d9e0}.bdg-neutral text{fill:#59636e}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#1f883d}.edge-modified{stroke:#bf8700}.edge-removed{stroke:#cf222e;stroke-dasharray:5 4;opacity:.7}.edge-neutral{stroke:#8c959f}.hero{stroke-width:2.25}.faded{opacity:.45}.glow{fill:none;stroke-width:7;opacity:.14}.msg-self{font-size:11px;fill:#1f2328}.lpill{fill:#ffffff;stroke:#d8dee4;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#59636e}.ltext-added{fill:#116329}.ltext-modified{fill:#7d4e00}.ltext-removed{fill:#a40e26}.cardsh{filter:drop-shadow(0 1px 2px rgba(31,35,40,.14))}.lifeline{stroke:#d1d9e0;stroke-width:1;stroke-dasharray:3 4}.actbar{fill:#b9f0c4;stroke:rgba(31,136,61,.55)}.msg{fill:none;stroke-width:1.5}.msg-return{stroke-dasharray:4 3;opacity:.8}.msg-strong{stroke-width:2.25}</style>
